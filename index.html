<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf0e6; --cream-2:#f3e3d4; --line:#e2cdb8;
    --maroon:#4e1022; --maroon-2:#6b2338;
    --gold:#b4884c; --gold-2:#d9be8c;
    --muted:#8a6a63; --wa:#0f8a4c; --wa-2:#0b6d3c;
    --sale:#9a1c37;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--maroon);
    font:300 16px/1.6 Jost,system-ui,sans-serif;padding-bottom:20px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* Masthead */
  header{text-align:center;padding:20px 0 0;border-bottom:1px solid var(--line)}
  header img{width:min(340px,80vw);height:auto;display:block;margin:0 auto}
  header img:not(.hide) ~ .lede{display:none}
  header h1{font:500 34px/1 "Cormorant Garamond",serif;letter-spacing:.18em;margin:0}
  .hide{display:none}
  .lede{margin:10px auto 0;color:var(--muted);font-size:14px;letter-spacing:.06em;max-width:38ch}
  .ticker{margin:16px 0 0;background:var(--maroon);color:var(--cream);overflow:hidden;
    font:300 12.5px/1 Jost;letter-spacing:.1em;padding:9px 16px;white-space:nowrap}
  .ticker b{font-weight:400;color:var(--gold-2)}

  /* Controls */
  .controls{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line)}
  .row1{display:flex;gap:10px;align-items:center;padding:10px 0 0}
  #search{flex:1;min-width:0;font:300 15px Jost,sans-serif;padding:11px 16px;color:var(--maroon);
    border:1px solid var(--line);border-radius:2px;background:#fff}
  #search::placeholder{color:#b09a8c}
  #search:focus{outline:1px solid var(--gold);outline-offset:0;border-color:var(--gold)}
  #sort{font:300 14px Jost,sans-serif;color:var(--maroon);background:#fff;border:1px solid var(--line);
    border-radius:2px;padding:11px 8px;max-width:170px}
  #sort:focus{outline:1px solid var(--gold);border-color:var(--gold)}
  .count{font-size:13px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
  /* Category menu: swipe left/right */
  .menu{position:relative;margin:0 -16px}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 14px;
    scroll-snap-type:x proximity;scroll-padding:0 16px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;scroll-snap-align:start;font:400 12.5px/1 Jost,sans-serif;letter-spacing:.12em;
    text-transform:uppercase;white-space:nowrap;padding:11px 18px;cursor:pointer;
    border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--maroon);
    transition:background .15s,color .15s,border-color .15s}
  .chip:hover{border-color:var(--gold)}
  .chip[aria-pressed="true"]{background:var(--maroon);color:var(--cream);border-color:var(--maroon)}
  .chip:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
  /* soft fades on the edges tell customers there is more to swipe */
  .menu::before,.menu::after{content:"";position:absolute;top:0;bottom:0;width:44px;pointer-events:none;
    z-index:1;transition:opacity .2s}
  .menu::before{left:0;background:linear-gradient(90deg,var(--cream) 20%,rgba(250,240,230,0))}
  .menu::after{right:0;background:linear-gradient(270deg,var(--cream) 20%,rgba(250,240,230,0))}
  .menu.at-start::before,.menu.at-end::after{opacity:0}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;
    border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--maroon);cursor:pointer;
    display:none;align-items:center;justify-content:center;font:300 20px/1 Jost;padding:0 0 2px;
    box-shadow:0 2px 8px rgba(78,16,34,.12)}
  .arrow:hover{border-color:var(--gold)}
  .arrow.prev{left:6px}.arrow.next{right:6px}
  @media(hover:hover) and (pointer:fine){.arrow{display:flex}}
  .menu.at-start .arrow.prev,.menu.at-end .arrow.next{display:none}
  @keyframes nudge{0%,100%{transform:translateX(0)}40%{transform:translateX(-28px)}}
  .chips.nudge .chip{animation:nudge 1.1s ease .5s 1}
  @media(prefers-reduced-motion:reduce){.chips.nudge .chip{animation:none}.chip{transition:none}}

  /* Sale strip */
  .strip{width:100%;margin:18px 0 0;display:flex;align-items:center;gap:14px;cursor:pointer;
    background:linear-gradient(90deg,var(--cream-2),#fff);border:1px solid var(--line);
    border-left:3px solid var(--sale);padding:13px 16px;text-align:left;color:var(--maroon)}
  .strip:hover{border-color:var(--gold);border-left-color:var(--sale)}
  .strip b{font:500 17px "Cormorant Garamond",serif;letter-spacing:.04em}
  .strip span{font-size:13px;color:var(--muted)}
  .strip em{margin-left:auto;font-style:normal;font:400 11px Jost;letter-spacing:.16em;
    text-transform:uppercase;color:var(--sale);white-space:nowrap}

  /* Grid */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin:18px 0 0}
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:24px}}
  .card{display:flex;flex-direction:column}
  .thumb{position:relative;aspect-ratio:3/4;background:var(--cream-2);overflow:hidden;
    display:flex;align-items:center;justify-content:center;border:0;padding:0;width:100%;cursor:zoom-in}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
  .card:hover .thumb img{transform:scale(1.04)}
  @media(prefers-reduced-motion:reduce){.thumb img{transition:none}.card:hover .thumb img{transform:none}}
  .thumb .ph{font:400 11px Jost;letter-spacing:.12em;text-transform:uppercase;color:#bfa48f}
  .thumb:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
  .tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .tag{font:400 10px/1 Jost;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:2px}
  .tag.off{background:var(--sale);color:#fff}
  .tag.new{background:var(--maroon);color:var(--cream)}
  .tag.best{background:var(--gold-2);color:var(--maroon)}
  .sold{position:absolute;inset:auto 0 0 0;background:rgba(78,16,34,.86);color:var(--cream);
    font:400 11px/1 Jost;letter-spacing:.14em;text-transform:uppercase;padding:8px;text-align:center}
  .name{font:500 17px/1.3 "Cormorant Garamond",serif;margin:10px 0 0;letter-spacing:.01em}
  .desc{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.5}
  .price{font:400 15px Jost;margin:6px 0 0;color:var(--maroon-2);letter-spacing:.03em}
  .price s{color:var(--muted);font-size:12.5px;margin-left:6px;text-decoration-color:var(--sale)}
  .price small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .save{font:400 11.5px Jost;color:var(--sale);letter-spacing:.04em;margin:3px 0 0}
  .foot{margin-top:10px;min-height:40px;display:flex;align-items:center}
  .add{width:100%;font:400 12px Jost;letter-spacing:.16em;text-transform:uppercase;padding:11px 8px;
    border:1px solid var(--maroon);background:transparent;color:var(--maroon);cursor:pointer;border-radius:2px}
  .add:hover{background:var(--maroon);color:var(--cream)}
  .out{font:400 12px Jost;letter-spacing:.1em;color:var(--muted)}
  .qty{display:flex;align-items:center;justify-content:space-between;width:100%;
    border:1px solid var(--maroon);background:var(--maroon);color:var(--cream);border-radius:2px}
  .qty button{width:40px;height:40px;border:0;background:none;color:var(--cream);
    font:300 19px Jost;cursor:pointer}
  .qty button:hover{background:var(--maroon-2)}
  .qty output{font:400 14px Jost;letter-spacing:.05em}
  .add:focus-visible,.qty button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

  .more{display:block;margin:30px auto 10px;font:400 12px Jost;letter-spacing:.16em;
    text-transform:uppercase;padding:13px 34px;border:1px solid var(--gold);
    background:transparent;color:var(--maroon);cursor:pointer;border-radius:2px}
  .more:hover{background:var(--cream-2)}
  .msg{padding:50px 10px;color:var(--muted);text-align:center;font-size:15px}

  /* Detail sheet */
  dialog{border:1px solid var(--line);background:var(--cream);color:var(--maroon);padding:0;
    width:min(560px,92vw);border-radius:2px}
  dialog::backdrop{background:rgba(78,16,34,.5)}
  .sheet{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:520px){.sheet{grid-template-columns:220px 1fr}}
  .sheet .pic{background:var(--cream-2);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
  .sheet .pic img{width:100%;height:100%;object-fit:cover}
  .sheet .body{padding:20px}
  .sheet h3{font:500 24px/1.2 "Cormorant Garamond",serif;margin:0 0 6px}
  .sheet .code{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .sheet .body p{font-size:13.5px;color:var(--muted)}
  .close{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--maroon);
    font:300 26px Jost;cursor:pointer;line-height:1}
  .ask{display:inline-block;margin-top:10px;font-size:13px;color:var(--maroon)}

  /* Order bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--maroon);color:var(--cream);
    transform:translateY(110%);transition:transform .2s ease}
  .bar.show{transform:none}
  @media(prefers-reduced-motion:reduce){.bar{transition:none}}
  .bar-in{display:flex;align-items:center;gap:12px;padding:11px 0}
  .sum{flex:1;min-width:0}
  .sum b{display:block;font:400 14px Jost;letter-spacing:.06em}
  .sum span{font:300 12.5px Jost;color:var(--gold-2)}
  .clear{border:0;background:none;color:var(--gold-2);font:300 12.5px Jost;cursor:pointer;
    text-decoration:underline;padding:8px 4px}
  .send{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--wa);
    color:#fff;font:400 13px Jost;letter-spacing:.06em;padding:12px 18px;border-radius:2px;white-space:nowrap}
  .send:hover{background:var(--wa-2)}
  .send:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
  .send svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
  footer{border-top:1px solid var(--line);margin-top:44px;padding:24px 0 8px;
    color:var(--muted);font-size:13px;text-align:center;line-height:1.8}
  footer a{color:var(--maroon)}
  @media(max-width:400px){.send{padding:11px 13px;font-size:12px}.send span{display:none}}
</style>
</head>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2m5.8 14.16c-.25.69-1.43 1.32-1.98 1.36-.53.04-1.02.23-3.44-.72-2.9-1.14-4.74-4.11-4.88-4.3-.14-.19-1.16-1.55-1.16-2.95 0-1.4.73-2.09 1-2.38.25-.28.55-.35.73-.35s.36 0 .52.01c.17.01.39-.06.61.47.23.55.78 1.9.85 2.04.07.14.11.3.02.49-.09.19-.14.3-.28.47-.14.16-.29.36-.41.49-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.17-.19.69-.8.87-1.08.19-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.32.07.12.07.67-.18 1.36"/></svg>
    Book on <span>WhatsApp</span>
  </a>
</div></div>

<script>
(function () {
  const PAGE = 60;
  const ORDER = ["Kitchen","Home and Living","Home Decor","Bags","Jewellery",
                 "Beauty and Personal Care","Gadgets"];
  let SHOP = {}, ALL = [], shown = [], drawn = 0, activeCat = "All", query = "", sortBy = "feat", hasDeals = false;
  const cart = new Map();
  const $ = id => document.getElementById(id);
  const money = n => (SHOP.currency || "Rs") + " " + Number(n || 0).toLocaleString("en-PK");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const was = p => Number(p.mrp) > Number(p.price) ? Number(p.mrp) : 0;      // original price, if reduced
  const off = p => was(p) ? Math.round((was(p) - p.price) / was(p) * 100) : 0;
  const find = id => ALL.find(x => x.id === id);

  fetch("products.json?v=" + Date.now())
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(start)
    .catch(() => {
      $("msg").textContent = "The catalogue could not load. If you opened this file straight from your computer, put it on your website first \u2014 browsers block local files.";
    });

  function start(d) {
    SHOP = d.shop || {};
    ALL = (d.products || []).map((p, i) => ({ ...p, id: p.id || "i" + i, price: Number(p.price) || 0 }));
    document.title = SHOP.name || "Catalogue";
    $("wordmark").textContent = (SHOP.name || "").toUpperCase();
    $("lede").textContent = SHOP.tagline || "";
    if (SHOP.note) { $("ticker").innerHTML = esc(SHOP.note); $("ticker").hidden = false; }
    if (SHOP.phone) $("footNote").textContent =
      "Prices may change. No WhatsApp? Call or SMS " + SHOP.phone + ".";
    $("search").placeholder = "Search " + ALL.length + " items";

    const cats = [...new Set(ALL.map(p => p.category).filter(Boolean))]
      .sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
    // Menu shows real categories only. New / Best seller / % off appear as badges on the product photos.
    const tabs = [["All", "Everything"]];
    cats.forEach(c => tabs.push([c, c]));

    tabs.forEach(([key, label]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.textContent = label; b.dataset.cat = key;
      b.setAttribute("aria-pressed", key === activeCat);
      b.onclick = () => pick(key);
      $("chips").appendChild(b);
    });
    setupMenu();

    const deals = ALL.filter(p => was(p) && p.inStock !== false);
    if (deals.length) {
      const best = Math.max(...deals.map(off));
      $("strip").innerHTML = "<div><b>Deals and sale</b><br><span>" + deals.length
        + " item" + (deals.length === 1 ? "" : "s") + " reduced, up to " + best
        + "% off</span></div><em>See all</em>";
      $("strip").onclick = () => pick("#sale");
      hasDeals = true;
    }

    $("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); filter(); });
    $("sort").addEventListener("change", e => { sortBy = e.target.value; filter(); });
    $("more").onclick = draw;
    $("clear").onclick = () => { cart.clear(); document.querySelectorAll(".card").forEach(foot); updateBar(); };
    $("sheetClose").onclick = () => $("sheet").close();
    $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("sheet").close(); });
    filter();
  }

  function setupMenu() {
    const chips = $("chips"), menu = $("menu");
    const edges = () => {
      const max = chips.scrollWidth - chips.clientWidth;
      menu.classList.toggle("at-start", chips.scrollLeft <= 4);
      menu.classList.toggle("at-end", chips.scrollLeft >= max - 4);
    };
    chips.addEventListener("scroll", edges, { passive: true });
    window.addEventListener("resize", edges);
    const step = dir => chips.scrollBy({ left: dir * chips.clientWidth * 0.7, behavior: "smooth" });
    $("prev").onclick = () => step(-1);
    $("next").onclick = () => step(1);
    // mouse wheel scrolls the menu sideways on desktop
    chips.addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && chips.scrollWidth > chips.clientWidth) {
        chips.scrollLeft += e.deltaY; e.preventDefault();
      }
    }, { passive: false });
    edges();
    // one gentle nudge on first load so customers see the menu can be swiped
    if (chips.scrollWidth > chips.clientWidth + 8) {
      chips.classList.add("nudge");
      setTimeout(() => chips.classList.remove("nudge"), 1800);
    }
  }

  function pick(key) {
    activeCat = key;
    [...$("chips").children].forEach(x => {
      const on = x.dataset.cat === key;
      x.setAttribute("aria-pressed", on);
      if (on) x.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    });
    filter();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function filter() {
    const words = query ? query.split(/\s+/) : [];
    shown = ALL.filter(p => {
      if (activeCat === "#new" && !p.isNew) return false;
      if (activeCat === "#best" && !p.isBest) return false;
      if (activeCat === "#sale" && !was(p)) return false;
      if (activeCat[0] !== "#" && activeCat !== "All" && p.category !== activeCat) return false;
      if (!words.length) return true;
      const hay = (p.name + " " + (p.note||"") + " " + (p.category||"") + " " + (p.id||"")).toLowerCase();
      return words.every(w => hay.includes(w));
    });

    if (sortBy === "low") shown.sort((a, b) => a.price - b.price);
    else if (sortBy === "high") shown.sort((a, b) => b.price - a.price);
    else if (sortBy === "off") shown.sort((a, b) => off(b) - off(a));

    $("strip").hidden = !hasDeals || activeCat === "#sale" || query !== "";
    $("grid").innerHTML = ""; drawn = 0;
    $("count").textContent = shown.length + (shown.length === 1 ? " item" : " items");
    $("msg").hidden = shown.length > 0;
    $("msg").textContent = "Nothing found. Try one word, or ask us on WhatsApp.";
    $("grid").hidden = shown.length === 0;
    draw();
  }

  function draw() {
    const slice = shown.slice(drawn, drawn + PAGE);
    const frag = document.createDocumentFragment();
    slice.forEach(p => frag.appendChild(card(p)));
    $("grid").appendChild(frag);
    drawn += slice.length;
    const left = shown.length - drawn;
    $("more").hidden = left <= 0;
    $("more").textContent = "Show " + Math.min(PAGE, left) + " more";
  }

  function thumb(p, zoom) {
    const t = document.createElement(zoom ? "button" : "div");
    t.className = zoom ? "thumb" : "pic";
    if (zoom) { t.type = "button"; t.setAttribute("aria-label", "Look at " + p.name); }
    if (p.image) {
      const img = new Image();
      img.src = p.image; img.alt = p.name; img.loading = "lazy"; img.decoding = "async";
      img.onerror = () => { t.innerHTML = '<span class="ph">Photo soon</span>'; if (zoom) dress(t, p); };
      t.appendChild(img);
    } else t.innerHTML = '<span class="ph">Photo soon</span>';
    if (zoom) dress(t, p);
    return t;
  }

  function dress(t, p) {
    if (t.querySelector(".tags")) return;
    const tags = document.createElement("div");
    tags.className = "tags";
    const add = (cls, txt) => { const s = document.createElement("span"); s.className = "tag " + cls; s.textContent = txt; tags.appendChild(s); };
    if (off(p)) add("off", off(p) + "% off");
    if (p.isNew) add("new", "New");
    if (p.isBest) add("best", "Best seller");
    if (tags.children.length) t.appendChild(tags);
    if (p.inStock === false) {
      const s = document.createElement("span");
      s.className = "sold"; s.textContent = "Sold out";
      t.appendChild(s);
    }
  }

  function priceHTML(p) {
    return `<p class="price">${money(p.price)}${was(p) ? `<s>${money(was(p))}</s>` : ""}`
      + (p.unit ? `<small>${esc(p.unit)}</small>` : "") + "</p>"
      + (was(p) ? `<p class="save">You save ${money(was(p) - p.price)}</p>` : "");
  }

  function card(p) {
    const el = document.createElement("article");
    el.className = "card"; el.dataset.id = p.id;
    const t = thumb(p, true);
    t.onclick = () => open(p);
    el.appendChild(t);

    const b = document.createElement("div");
    b.innerHTML = `<h2 class="name">${esc(p.name)}</h2>`
      + (p.note ? `<p class="desc">${esc(p.note)}</p>` : "") + priceHTML(p);
    el.appendChild(b);

    const f = document.createElement("div");
    f.className = "foot";
    el.appendChild(f);
    foot(el);
    return el;
  }

  function open(p) {
    const body = $("sheetBody");
    body.innerHTML = "";
    body.appendChild(thumb(p, false));
    const d = document.createElement("div");
    d.className = "body";
    const ask = "https://wa.me/" + (SHOP.whatsapp || "") + "?text="
      + encodeURIComponent("Assalam o Alaikum! Please tell me more about " + p.name + " (" + p.id + ").");
    d.innerHTML = `<h3>${esc(p.name)}</h3><p class="code">${esc(p.id)}${p.category ? " \u00b7 " + esc(p.category) : ""}</p>`
      + priceHTML(p) + (p.note ? `<p>${esc(p.note)}</p>` : "")
      + (p.inStock === false ? '<p class="out">Sold out just now. Message us and we will tell you when it is back.</p>' : "")
      + `<a class="ask" href="${ask}" target="_blank" rel="noopener">Ask about this item on WhatsApp</a>`;
    body.appendChild(d);
    $("sheet").showModal();
  }

  function foot(el) {
    const p = find(el.dataset.id);
    const f = el.querySelector(".foot");
    f.innerHTML = "";
    if (p.inStock === false) { f.innerHTML = '<span class="out">Ask us when it returns</span>'; return; }
    if (!cart.has(p.id)) {
      const a = document.createElement("button");
      a.className = "add"; a.type = "button"; a.textContent = "Add";
      a.onclick = () => { cart.set(p.id, 1); foot(el); updateBar(); };
      f.appendChild(a); return;
    }
    const box = document.createElement("div"); box.className = "qty";
    const m = document.createElement("button"); m.type = "button"; m.textContent = "\u2212";
    m.setAttribute("aria-label", "One less " + p.name);
    const o = document.createElement("output"); o.textContent = cart.get(p.id);
    const pl = document.createElement("button"); pl.type = "button"; pl.textContent = "+";
    pl.setAttribute("aria-label", "One more " + p.name);
    m.onclick = () => { const n = cart.get(p.id) - 1; n <= 0 ? cart.delete(p.id) : cart.set(p.id, n); foot(el); updateBar(); };
    pl.onclick = () => { cart.set(p.id, cart.get(p.id) + 1); foot(el); updateBar(); };
    box.append(m, o, pl);
    f.appendChild(box);
  }

  function updateBar() {
    let items = 0, total = 0, saved = 0;
    cart.forEach((q, id) => {
      const p = find(id);
      items += q; total += q * p.price;
      if (was(p)) saved += q * (was(p) - p.price);
    });
    $("bar").classList.toggle("show", items > 0);
    document.body.style.paddingBottom = items ? "96px" : "20px";
    if (!items) return;
    $("barCount").textContent = items + (items === 1 ? " item selected" : " items selected");
    $("barTotal").textContent = "Total " + money(total) + (saved ? " \u00b7 saving " + money(saved) : "");

    const lines = []; let n = 1;
    cart.forEach((q, id) => {
      const p = find(id);
      lines.push(n++ + ". " + p.name + " (" + p.id + ") \u2014 " + q + " x " + money(p.price)
        + " = " + money(q * p.price) + (was(p) ? " (was " + money(was(p)) + ")" : ""));
    });
    let body = lines.join("\n");
    if (body.length > 1200) {
      const keep = []; let len = 0;
      for (const l of lines) { if (len + l.length > 1100) break; keep.push(l); len += l.length + 1; }
      body = keep.join("\n") + "\n\u2026and " + (lines.length - keep.length) + " more items (full list to follow)";
    }
    const msg = "Assalam o Alaikum " + (SHOP.name || "") + "! I would like to book:\n\n" + body
      + "\n\nTotal: " + money(total) + (saved ? "\nSaving: " + money(saved) : "")
      + "\n\nName: \nAddress: \nCity: ";
    $("send").href = "https://wa.me/" + (SHOP.whatsapp || "") + "?text=" + encodeURIComponent(msg);
  }
})();
</script>
</body>
</html>
